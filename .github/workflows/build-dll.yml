name: Build pf3_32 DLL

on:
  push:
    branches: [ main ]   # 如果你用 master，这里改成 master
  workflow_dispatch:      # 手动触发也可以

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build pf3_32 (Win32 Release)
        run: msbuild pf3v.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:OutDir=build\\

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: pf3_32
          path: build\pf3_32.dll
